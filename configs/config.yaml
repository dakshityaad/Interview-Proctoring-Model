# Interview screen-reading detector configuration.

# Paths are relative to the repository root unless an absolute path is given.
paths:
  data_raw: data/raw
  features_csv: data/features.csv
  models_dir: models
  face_landmarker_model: models/face_landmarker.task

# Each training example is a sequence of consecutive frame-level features.
windowing:
  window_size: 60
  stride: 10

# Dedicated reading detector settings. At 15 FPS, 75 frames represent 5 seconds.
reading_detection:
  sampling_fps: 15
  window_seconds: 5
  stride_seconds: 0.5
  positive_threshold: 0.70
  negative_threshold: 0.40
  consecutive_positive_windows: 2
  consecutive_negative_windows: 2
  motion_features: true

# Class IDs used by the training data and model outputs.
classes:
  talking: 0
  looking: 1
  reading: 2

# Alert behavior for the rolling online score.
# These values are initial defaults and should be tuned on validation data.
alert:
  score_window_size: 10
  warning_threshold: 0.50
  strong_threshold: 0.75

# Constants used while turning recorded videos into feature rows.
extraction:
  no_face_policy: skip
  gaze_component: horizontal
  video_extensions:
    - .avi
    - .m4v
    - .mov
    - .mp4
    - .mkv
    - .webm

# The feature CSV schema is kept here so downstream code can validate inputs.
features:
  columns:
    - subject_id
    - class_label
    - frame_number
    - pitch
    - yaw
    - gaze_ratio
  reading_motion_columns:
    - pitch_velocity
    - yaw_velocity
    - gaze_velocity
    - pitch_acceleration
    - yaw_acceleration
    - gaze_acceleration
    - horizontal_motion
